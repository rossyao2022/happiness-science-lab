<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天赋实验室 | Talent Lab - HappyKua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        :root {
            --ink: #263247;
            --muted: #778096;
            --paper: #fff7f1;
            --rose: #ff6b6b;
            --orange: #ff922b;
            --gold: #fcc419;
            --blue: #5c7cfa;
            --green: #51cf66;
            --line: rgba(38, 50, 71, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            background:
                radial-gradient(circle at 10% 0%, rgba(255, 107, 107, 0.22), transparent 32%),
                radial-gradient(circle at 90% 12%, rgba(92, 124, 250, 0.18), transparent 34%),
                linear-gradient(135deg, #fff7f1 0%, #f1f5ff 72%, #eefaf2 100%);
        }

        button, textarea { font: inherit; }

        .brand-font { font-family: 'Fraunces', 'Noto Sans SC', serif; }

        .app-shell {
            width: min(100%, 880px);
            min-height: 100vh;
            margin: 0 auto;
            padding: 18px 16px 28px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.86);
            border-radius: 8px;
            box-shadow: 0 18px 44px rgba(255, 107, 107, 0.11);
            backdrop-filter: blur(18px);
        }

        .report-panel {
            background: rgba(255, 255, 255, 0.94);
            border-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 18px 44px rgba(38, 50, 71, 0.08);
        }

        .rainbow-line {
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(to right, var(--rose), var(--orange), var(--gold), var(--green), var(--blue));
        }

        .view { display: none; }
        .view.active { display: block; animation: rise 0.32s ease both; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-window {
            height: calc(100vh - 252px);
            min-height: 420px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .chat-window::-webkit-scrollbar { display: none; }

        .ai-bubble,
        .user-bubble {
            border-radius: 8px;
            animation: rise 0.25s ease both;
        }

        .ai-bubble {
            background: rgba(255, 255, 255, 0.88);
            border-left: 4px solid var(--rose);
            box-shadow: 0 10px 24px rgba(255, 107, 107, 0.1);
        }

        .user-bubble {
            color: white;
            background: linear-gradient(135deg, var(--rose), var(--orange));
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.18);
        }

        .soft-input {
            min-height: 52px;
            max-height: 132px;
            resize: none;
            outline: none;
        }

        .primary-btn {
            border: 0;
            border-radius: 8px;
            color: white;
            background: linear-gradient(135deg, var(--rose), var(--orange));
            box-shadow: 0 14px 26px rgba(255, 107, 107, 0.2);
            font-weight: 900;
            transition: transform 0.18s ease;
        }

        .primary-btn:active { transform: translateY(1px) scale(0.99); }

        .ghost-btn {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.74);
            color: var(--ink);
            font-weight: 900;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: rgba(38, 50, 71, 0.12);
        }

        .step-dot.active,
        .step-dot.done {
            background: linear-gradient(135deg, var(--rose), var(--orange));
            box-shadow: 0 0 0 5px rgba(255, 107, 107, 0.12);
        }

        .theme-pill {
            border-radius: 999px;
            padding: 8px 11px;
            background: rgba(255, 107, 107, 0.1);
            color: #c74655;
            font-size: 12px;
            font-weight: 900;
        }

        .report-section {
            border-top: 1px solid var(--line);
            padding-top: 18px;
        }

        .icon-mark {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            color: white;
            background: linear-gradient(135deg, var(--rose), var(--orange));
            box-shadow: 0 12px 22px rgba(255, 107, 107, 0.2);
        }

        @media (max-width: 640px) {
            .chat-window {
                height: calc(100vh - 236px);
                min-height: 360px;
            }
        }
    </style>
</head>
<body>

            <div class="glass p-2 mt-4 flex items-end gap-2">

        <section id="reportView" class="view">
            <div class="glass report-panel p-5 md:p-7">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-5 mb-6">
                    <div>
                        <p class="text-sm font-black text-slate-400" data-i18n="reportEyebrow">轻量版报告</p>
                        <h1 class="brand-font text-4xl leading-tight" id="reportTitle">个人天赋使用说明书</h1>

                    </div>
                    <div class="flex gap-2">
                        <button onclick="showView('chatView')" class="ghost-btn px-4 py-3 text-sm" data-i18n="backChat">回到对话</button>
                        <button onclick="copyReport()" class="primary-btn px-4 py-3 text-sm" data-i18n="copyReport">复制报告</button>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 mb-6" id="themePills"></div>

                <div class="grid md:grid-cols-2 gap-4 mb-6">
                    <div class="glass report-panel p-4 shadow-none">
                        <p class="text-xs font-black text-slate-400 uppercase">Core Talent</p>
                        <h2 class="font-black text-2xl mt-2" id="coreTalent"></h2>
                        <p class="text-slate-500 leading-relaxed mt-2" id="coreTalentText"></p>
                    </div>
                    <div class="glass report-panel p-4 shadow-none">
                        <p class="text-xs font-black text-slate-400 uppercase">Energy Source</p>

                </div>

                <div class="report-section">
                    <h2 class="font-black text-xl mb-3" data-i18n="cluesTitle">你的 4 个天赋线索</h2>
                    <div class="grid md:grid-cols-2 gap-3" id="clueCards"></div>

                <div class="report-section mt-6">
                    <h2 class="font-black text-xl mb-3">KUA</h2>
                    <div class="grid md:grid-cols-3 gap-3" id="kuaActions"></div>
                </div>

                <div class="report-section mt-6">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="icon-mark"><i class="fas fa-lock"></i></div>
                        <div>
                            <h2 class="font-black text-xl" data-i18n="proTitle">解锁完整版天赋报告</h2>
                            <p class="text-sm text-slate-500" data-i18n="proCopy">包含 3 个天赋原型、职业场景、关系提醒、7 天天赋激活计划和 PDF 导出。</p>

                    </div>
                    <button class="primary-btn px-5 py-3" onclick="showUpgradeMessage()" data-i18n="unlock">解锁完整报告</button>
                </div>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>

                reset: "Restarted",

                kua: {

                }

        };

        const themeRules = [
            {
                id: "insight",
                zh: "洞察型",
                en: "Insight Maker",
                keywords: ["观察", "分析", "理解", "看见", "本质", "思考", "研究", "洞察", "observe", "analyze", "understand", "insight", "think", "research"],
                textZh: "你容易从复杂细节里看见模式，擅长把模糊感受整理成清晰判断。",
                textEn: "You tend to see patterns in complexity and turn vague signals into clear judgment."
            },
            {
                id: "creator",
                zh: "创造型",
                en: "Creator",
                keywords: ["画", "写", "设计", "创作", "表达", "想象", "做东西", "音乐", "create", "write", "design", "make", "imagine", "music", "art"],
                textZh: "你的能量常在创造里被点亮，越能表达自己的东西，越容易进入心流。",
                textEn: "Your energy lights up through creation. Personal expression helps you enter flow."
            },
            {
                id: "connector",
                zh: "连接型",
                en: "Connector",
                keywords: ["朋友", "聊天", "倾听", "关系", "帮助", "共情", "团队", "family", "friend", "listen", "relationship", "help", "team", "empathy"],
                textZh: "你对人的状态敏感，擅长建立信任、理解他人，并让关系流动起来。",
                textEn: "You are sensitive to people, good at building trust, understanding others, and moving relationships forward."
            },
            {
                id: "builder",
                zh: "推进型",
                en: "Builder",
                keywords: ["完成", "执行", "组织", "计划", "推进", "落地", "目标", "finished", "execute", "organize", "plan", "build", "goal", "deliver"],
                textZh: "你会从把事情真正做出来里获得确定感，擅长把想法变成步骤和结果。",
                textEn: "You gain energy from making things real and can turn ideas into steps and outcomes."
            },
            {
                id: "sensitive",
                zh: "敏感感知型",
                en: "Sensitive Sensor",
                keywords: ["敏感", "情绪", "感受", "气氛", "细腻", "美", "身体", "sensitive", "emotion", "feeling", "beauty", "body", "mood"],
                textZh: "你的敏感不是负担，它可能是一种高分辨率感知，让你更早捕捉情绪、氛围和需要。",
                textEn: "Your sensitivity may be high-resolution perception, helping you notice emotions, atmosphere, and needs earlier."
            }
        ];

        let currentLang = localStorage.getItem("happykua-talent-lang") || "zh";
        let currentStep = 0;
        let talentAnswers = [];
        let lastReport = null;

        function buildTalentStatePayload() {
            return {
                currentStep,
                talentAnswers,
                chatHtml: document.getElementById("chatWindow").innerHTML
            };
        }

        function buildTalentProgress(report = lastReport) {
            return {
                completed: Boolean(report),
                count: talentAnswers.length,
                lastActivityAt: new Date().toISOString()
            };
        }

        function syncTalentModule(statePayload = buildTalentStatePayload(), report = lastReport) {
            const auth = window.HappyKuaAuth;
            if (!auth) return;
            auth.setModuleData("talent", {
                state: statePayload,
                report,
                progress: buildTalentProgress(report)
            });
        }

        window.onload = () => {
            restoreTalentState();
            applyLanguage();
            if (!document.getElementById("chatWindow").children.length) {
                addBubble(i18n[currentLang].intro, "ai");
            }
            renderStepDots();
            updateControls();
        };

        function toggleLanguage() {
            currentLang = currentLang === "zh" ? "en" : "zh";
            localStorage.setItem("happykua-talent-lang", currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang;
            document.getElementById("langDisplay").innerText = t.langName;
            document.getElementById("typingText").innerText = t.typing;
            document.getElementById("userInput").placeholder = t.placeholder;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) el.innerText = t[key];
            });
            renderStepDots();
            if (lastReport) renderReport(lastReport);
        }

        function addBubble(content, role) {
            const chatWindow = document.getElementById("chatWindow");
            const wrapper = document.createElement("div");
            wrapper.className = `flex ${role === "user" ? "justify-end" : "justify-start"} gap-3`;
            wrapper.innerHTML = role === "user"
                ? `<div class="user-bubble p-4 max-w-[88%] text-sm leading-relaxed">${escapeHtml(content)}</div>`
                : `<div class="w-10 h-10 rounded-full bg-red-100 text-red-500 shrink-0 grid place-items-center"><i class="fas fa-fingerprint"></i></div><div class="ai-bubble p-4 max-w-[88%] text-sm leading-relaxed">${content}</div>`;
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            addBubble(text, "user");
            input.value = "";
            input.style.height = "auto";

            if (currentStep > 0 && currentStep <= 4) {
                talentAnswers[currentStep - 1] = {
                    step: currentStep,
                    question: i18n.zh.questions[currentStep - 1].replace(/<[^>]*>/g, ""),
                    answer: text
                };
                saveTalentState();
            }

            const typing = document.getElementById("typing");
            typing.classList.remove("invisible");

            setTimeout(() => {
                typing.classList.add("invisible");
                if (currentStep < i18n[currentLang].questions.length) {
                    addBubble(i18n[currentLang].questions[currentStep], "ai");
                    currentStep++;
                    saveTalentState();
                    renderStepDots();
                    updateControls();
                } else {
                    addBubble(i18n[currentLang].ready, "ai");
                    saveTalentState();
                    updateControls(true);
                }
            }, 520);
        }

        function updateControls(forceReady = false) {
            const ready = forceReady || talentAnswers.length >= 4;
            document.getElementById("sendButton").classList.toggle("hidden", ready);
            document.getElementById("generateButton").classList.toggle("hidden", !ready);
            document.getElementById("stepCounter").innerText = `Step: ${Math.min(currentStep, 4)} / 4`;
        }

        function renderStepDots() {
            document.getElementById("stepDots").innerHTML = [1, 2, 3, 4].map(step => {
                const cls = step < currentStep ? "done" : step === currentStep ? "active" : "";
                return `<span class="step-dot ${cls}"></span>`;
            }).join("");
        }

        function saveTalentState() {
            const payload = buildTalentStatePayload();
            syncTalentModule(payload);
            const auth = window.HappyKuaAuth;
            if (!auth || auth.getCurrentUser().isGuest) {
                localStorage.setItem(TALENT_STATE_KEY, JSON.stringify(payload));
            }
        }

        function restoreTalentState() {
            const auth = window.HappyKuaAuth;
            const moduleData = auth?.getModuleData("talent") || {};
            if (moduleData.state) {
                currentStep = moduleData.state.currentStep || 0;
                talentAnswers = moduleData.state.talentAnswers || [];
                document.getElementById("chatWindow").innerHTML = moduleData.state.chatHtml || "";
                lastReport = moduleData.report || null;
                return;
            }

            if (auth && !auth.getCurrentUser().isGuest) return;

            try {
                const state = JSON.parse(localStorage.getItem(TALENT_STATE_KEY) || "null");
                if (!state) return;
                currentStep = state.currentStep || 0;
                talentAnswers = state.talentAnswers || [];
                document.getElementById("chatWindow").innerHTML = state.chatHtml || "";
                const savedReport = JSON.parse(localStorage.getItem(TALENT_REPORT_KEY) || "null");
                if (savedReport) lastReport = savedReport;
                syncTalentModule(state, lastReport);
            } catch {
                currentStep = 0;
                talentAnswers = [];
            }
        }

        function generateTalentReport() {
            if (talentAnswers.length < 4 || talentAnswers.some(item => !item.answer || item.answer.length < 2)) {
                showToast(i18n[currentLang].needAnswer);
                return;
            }
            lastReport = buildTalentReport(talentAnswers);
            syncTalentModule(buildTalentStatePayload(), lastReport);
            const auth = window.HappyKuaAuth;
            if (!auth || auth.getCurrentUser().isGuest) {
                localStorage.setItem(TALENT_REPORT_KEY, JSON.stringify(lastReport));
            }
            renderReport(lastReport);
            showView("reportView");
        }

        function buildTalentReport(answers) {
            const themes = detectTalentThemes(answers);
            const primary = themes[0] || themeRules[0];
            const secondary = themes[1] || themeRules[2];
            const lang = currentLang;
            const zh = lang === "zh";
            const answerText = answers.map(item => item.answer).join(" ");

            return {
                title: i18n[lang].reportTitle,
                summary: i18n[lang].reportSummary,
                themes: themes.slice(0, 3).map(theme => zh ? theme.zh : theme.en),
                coreTalent: zh ? `${primary.zh} × ${secondary.zh}` : `${primary.en} × ${secondary.en}`,
                coreTalentText: zh
                    ? `${primary.textZh} 同时，你也带着「${secondary.zh}」的线索。你的天赋不只是会什么，而是你在哪些情境里会自然变亮。`
                    : `${primary.textEn} You also carry signs of the ${secondary.en}. Talent is not only what you can do, but where you naturally brighten.`,
                energySource: inferEnergySource(answerText, zh),
                energySourceText: zh
                    ? "当你靠近这个能量来源时，不一定更轻松，但会更像自己。这是判断天赋是否值得发展的重要信号。"
                    : "When you move toward this energy source, it may not feel easier, but it feels more like you. That is an important signal.",
                clues: answers.map((item, index) => ({
                    title: getClueTitle(index, zh),
                    text: item.answer
                })),
                kua: [
                    {
                        title: i18n[lang].kua.know,
                        text: zh ? `先承认：你的「${zh ? primary.zh : primary.en}」不是偶然，它反复出现在你的故事里。` : `First acknowledge that your ${primary.en} is not random. It repeats in your story.`
                    },
                    {
                        title: i18n[lang].kua.unite,
                        text: zh ? "选择一个真实场景：工作、学习、关系或创作，把这个天赋用在一个小问题上。" : "Choose one real scene: work, learning, relationship, or creation. Use this talent on one small problem."
                    },
                    {
                        title: i18n[lang].kua.act,
                        text: zh ? "未来 24 小时内做一个 10 分钟实验：用你的天赋帮一个人、完成一个小作品，或解决一个具体卡点。" : "In the next 24 hours, run a 10-minute experiment: help someone, make a small artifact, or solve one concrete friction."
                    }
                ]
            };
        }

        function detectTalentThemes(answers) {
            const text = answers.map(item => item.answer).join(" ").toLowerCase();
            const scored = themeRules.map(theme => {
                const score = theme.keywords.reduce((sum, keyword) => sum + (text.includes(keyword.toLowerCase()) ? 1 : 0), 0);
                return { ...theme, score };
            }).sort((a, b) => b.score - a.score);
            const matched = scored.filter(theme => theme.score > 0);
            return matched.length ? matched : scored.slice(0, 2);
        }

        function inferEnergySource(text, zh) {
            const lower = text.toLowerCase();
            if (/朋友|家人|团队|聊天|倾听|关系|friend|family|team|listen|relationship/.test(lower)) {
                return zh ? "关系连接" : "Relationship connection";
            }
            if (/完成|推进|目标|任务|finished|goal|task|deliver/.test(lower)) {
                return zh ? "把事情做成" : "Making things real";
            }
            if (/画|写|设计|创作|create|write|design|art/.test(lower)) {
                return zh ? "自由创造" : "Free creation";
            }
            if (/观察|思考|研究|分析|observe|think|research|analyze/.test(lower)) {
                return zh ? "理解本质" : "Understanding patterns";
            }
            return zh ? "靠近真实的自己" : "Being closer to your real self";
        }

        function getClueTitle(index, zh) {
            const titles = zh
                ? ["童年线索", "无意识胜任", "能量回血点", "阴影宝藏"]
                : ["Childhood clue", "Natural competence", "Energy source", "Shadow gift"];
            return titles[index];
        }

        function renderReport(report) {
            document.getElementById("reportTitle").innerText = report.title;
            document.getElementById("reportSummary").innerText = report.summary;
            document.getElementById("coreTalent").innerText = report.coreTalent;
            document.getElementById("coreTalentText").innerText = report.coreTalentText;
            document.getElementById("energySource").innerText = report.energySource;
            document.getElementById("energySourceText").innerText = report.energySourceText;
            document.getElementById("themePills").innerHTML = report.themes.map(theme => `<span class="theme-pill">${theme}</span>`).join("");
            document.getElementById("clueCards").innerHTML = report.clues.map(clue => `
                <div class="glass report-panel p-4 shadow-none">
                    <p class="text-xs font-black text-slate-400 uppercase">${clue.title}</p>
                    <p class="font-bold text-slate-600 leading-relaxed mt-2">${escapeHtml(clue.text)}</p>
                </div>
            `).join("");
            document.getElementById("kuaActions").innerHTML = report.kua.map(item => `
                <div class="glass report-panel p-4 shadow-none">
                    <p class="font-black">${item.title}</p>
                    <p class="text-sm text-slate-500 leading-relaxed mt-2">${item.text}</p>
                </div>
            `).join("");
        }

        function showView(viewId) {
            document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
            document.getElementById(viewId).classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function restartTalentLab() {
            const auth = window.HappyKuaAuth;
            if (auth) auth.clearModuleData("talent");
            if (!auth || auth.getCurrentUser().isGuest) {
                localStorage.removeItem(TALENT_STATE_KEY);
                localStorage.removeItem(TALENT_REPORT_KEY);
            }
            currentStep = 0;
            talentAnswers = [];
            lastReport = null;
            document.getElementById("chatWindow").innerHTML = "";
            addBubble(i18n[currentLang].intro, "ai");
            renderStepDots();
            updateControls();
            showView("chatView");
            showToast(i18n[currentLang].reset);
        }

        function copyReport() {
            if (!lastReport) return;
            const text = [
                lastReport.title,
                lastReport.summary,
                `核心天赋 / Core Talent: ${lastReport.coreTalent}`,
                `能量来源 / Energy Source: ${lastReport.energySource}`,
                ...lastReport.kua.map(item => `${item.title}: ${item.text}`)
            ].join("\n\n");
            navigator.clipboard?.writeText(text);
            showToast(i18n[currentLang].copied);
        }

        function showUpgradeMessage() {
            showToast(i18n[currentLang].upgrade);
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.className = "fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-lg bg-slate-900 text-white text-sm font-black shadow-2xl";
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1800);
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.getElementById("userInput").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = `${this.scrollHeight}px`;
        });
        window.addEventListener("happykua:user-changed", () => window.location.reload());
    </script>
</body>
</html>
