<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭成长方案生成器 | HappyKua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        :root {
            --paper: #f7f5ef;
            --ink: #1f2937;
            --muted: #64748b;
            --line: #d8dee8;
            --teal: #0f766e;
            --teal-soft: #e6f3f1;
            --amber: #b7791f;
            --amber-soft: #fff4db;
            --blue: #2563eb;
            --blue-soft: #e9efff;
            --coral: #c2410c;
            --coral-soft: #fff0e8;
            --rose: #be123c;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Lexend', 'Noto Sans SC', sans-serif;
        }

        .tool-panel {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 16px 44px rgba(31, 41, 55, 0.08);
        }

        .section-rule {
            border-top: 1px solid var(--line);
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .field-control {
            width: 100%;
            min-height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #1e293b;
            padding: 0.7rem 0.85rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .field-control:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
        }

        .metric-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #fff;
            padding: 0.45rem 0.7rem;
            color: #475569;
            font-size: 0.8rem;
            font-weight: 700;
            max-width: 100%;
        }

        .report-section {
            padding: 1.25rem 0;
            border-top: 1px solid var(--line);
        }

        .report-section:first-child { border-top: 0; padding-top: 0; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
            font-size: 1rem;
            font-weight: 900;
            color: #111827;
        }

        .section-title i {
            display: inline-flex;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--teal-soft);
            color: var(--teal);
            font-size: 0.8rem;
        }

        .kua-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.9rem;
        }

        .kua-box,
        .day-card,
        .principle-row {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        .kua-box { padding: 1rem; }

        .kua-box h4 {
            margin-bottom: 0.55rem;
            font-size: 0.95rem;
            font-weight: 900;
        }

        .kua-box ul,
        .report-list {
            display: grid;
            gap: 0.45rem;
            color: #475569;
            font-size: 0.92rem;
            line-height: 1.68;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .kua-box li,
        .report-list li {
            position: relative;
            padding-left: 1rem;
        }

        .kua-box li::before,
        .report-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.72em;
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: var(--teal);
        }

        .day-card {
            display: grid;
            grid-template-columns: 112px 1fr;
            gap: 0.85rem;
            padding: 0.9rem;
        }

        .day-index {
            display: flex;
            min-height: 66px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: var(--blue-soft);
            color: #1d4ed8;
            font-weight: 900;
        }

        .day-index span {
            color: #64748b;
            font-size: 0.75rem;
            line-height: 1.35;
            text-align: center;
        }

        .principle-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 0.75rem;
            padding: 0.85rem;
        }

        .empty-state {
            min-height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }

        .action-button {
            min-height: 44px;
            border-radius: 8px;
            font-weight: 900;
            transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
        }

        .action-button:hover { transform: translateY(-1px); }

        .action-button:active { transform: translateY(0); }

        .toast {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 60;
            display: none;
            max-width: min(360px, calc(100vw - 2rem));
            border-radius: 8px;
            background: #111827;
            color: #fff;
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.24);
        }

        .toast.is-visible { display: block; }

        @media (max-width: 980px) {
            .kua-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .day-card,
            .principle-row {
                grid-template-columns: 1fr;
            }

            .empty-state { min-height: 360px; }
        }

        @media print {
            body { background: #fff; }
            nav,
            .input-column,
            .report-actions,
            .toast { display: none !important; }
            .print-column { width: 100% !important; }
            .tool-panel { box-shadow: none; border: 0; }
        }
    </style>
</head>
<body>
    <nav class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
            <a href="/lab" class="inline-flex items-center gap-2 text-sm font-black text-teal-700">
                <i class="fas fa-chevron-left text-xs"></i>
                <span>HappyKua Family Lab</span>
            </a>
            <div class="flex items-center gap-3">
                <div data-happykua-account-widget></div>
                <div class="hidden items-center gap-2 text-xs font-bold text-slate-500 sm:flex">
                    <span class="metric-chip"><i class="fas fa-seedling text-teal-700"></i>KUA 知联行</span>
                    <span class="metric-chip"><i class="fas fa-scale-balanced text-amber-700"></i>政策原则</span>
                    <span class="metric-chip"><i class="fas fa-user-graduate text-blue-700"></i>小学优先</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto grid max-w-7xl gap-5 px-4 py-6 sm:px-6 lg:grid-cols-[420px_minmax(0,1fr)]">
        <aside class="input-column tool-panel self-start">
            <div class="border-b border-slate-200 p-5">
                <p class="text-xs font-black uppercase tracking-[0.18em] text-teal-700">Family Growth Generator</p>
                <h1 class="mt-2 text-2xl font-black tracking-tight text-slate-900">家庭成长方案生成器</h1>
                <p class="mt-2 text-sm leading-6 text-slate-600">面向小学家长，兼容青春期场景。先本地生成专业指导报告，未来可接入 AI 增强内容。</p>
            </div>

            <form id="familyForm" class="grid gap-5 p-5">
                <section>
                    <div class="mb-3 flex items-center justify-between">
                        <h2 class="text-sm font-black text-slate-900">一、孩子阶段</h2>
                        <span class="text-xs font-bold text-slate-400">必填</span>
                    </div>
                    <label class="field-label" for="ageStage"><i class="fas fa-child-reaching text-teal-700"></i>年龄段 / 学段</label>
                    <select id="ageStage" class="field-control" name="ageStage">
                        <option value="lowerPrimary">小学低年级（1-3 年级）</option>
                        <option value="upperPrimary">小学高年级（4-6 年级）</option>
                        <option value="juniorHigh">初中 / 青春期</option>
                        <option value="seniorHigh">高中 / 升学压力期</option>
                    </select>
                </section>

                <section class="section-rule pt-5">
                    <div class="mb-3 flex items-center justify-between">
                        <h2 class="text-sm font-black text-slate-900">二、家庭画像</h2>
                        <span class="text-xs font-bold text-slate-400">选择最接近的一项</span>
                    </div>
                    <div class="grid gap-4">
                        <div>
                            <label class="field-label" for="familyContext"><i class="fas fa-people-roof text-amber-700"></i>家庭情况</label>
                            <select id="familyContext" class="field-control" name="familyContext">
                                <option value="twoParents">双亲共同养育</option>
                                <option value="inconsistentParents">父母教育理念不一致</option>
                                <option value="grandparent">隔代养育参与较多</option>
                                <option value="singleParent">单亲家庭</option>
                                <option value="reconstituted">重组家庭</option>
                                <option value="multiChild">多孩家庭</option>
                                <option value="remoteCare">异地陪伴 / 留守照护</option>
                            </select>
                        </div>
                        <div>
                            <label class="field-label" for="caregiver"><i class="fas fa-hand-holding-heart text-orange-700"></i>主要照护人</label>
                            <select id="caregiver" class="field-control" name="caregiver">
                                <option value="bothParents">父母共同负责</option>
                                <option value="motherMain">母亲为主</option>
                                <option value="fatherMain">父亲为主</option>
                                <option value="grandparentsMain">祖辈为主</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="section-rule pt-5">
                    <div class="mb-3 flex items-center justify-between">
                        <h2 class="text-sm font-black text-slate-900">三、主要问题</h2>
                        <span class="text-xs font-bold text-slate-400">先抓主线</span>
                    </div>
                    <label class="field-label" for="primaryConcern"><i class="fas fa-compass text-blue-700"></i>当前最需要改善的领域</label>
                    <select id="primaryConcern" class="field-control" name="primaryConcern">
                        <option value="learningHabit">学习习惯 / 作业拖拉</option>
                        <option value="communication">亲子沟通 / 不愿交流</option>
                        <option value="digitalUse">手机 / 游戏 / 短视频</option>
                        <option value="emotion">情绪管理 / 易怒焦虑</option>
                        <option value="peerRelation">同伴关系 / 校园适应</option>
                        <option value="ruleConflict">规则冲突 / 顶嘴对抗</option>
                        <option value="selfCare">自理能力 / 劳动习惯</option>
                        <option value="adolescentBoundary">青春期边界 / 自我认同</option>
                    </select>
                </section>

                <section class="section-rule grid gap-4 pt-5">
                    <div>
                        <label class="field-label" for="recentEvent"><i class="fas fa-note-sticky text-teal-700"></i>最近发生的一件典型事件</label>
                        <textarea id="recentEvent" class="field-control min-h-[92px]" name="recentEvent" maxlength="260" placeholder="例如：晚上写作业拖到很晚，提醒几次后孩子发脾气，说不想上学。"></textarea>
                    </div>
                    <div>
                        <label class="field-label" for="currentDifficulty"><i class="fas fa-circle-question text-amber-700"></i>家长现在最困扰的点</label>
                        <textarea id="currentDifficulty" class="field-control min-h-[82px]" name="currentDifficulty" maxlength="220" placeholder="例如：不知道该管严一点，还是先安抚情绪。"></textarea>
                    </div>
                    <div>
                        <label class="field-label" for="desiredGoal"><i class="fas fa-bullseye text-blue-700"></i>希望 7 天后看到的变化</label>
                        <input id="desiredGoal" class="field-control" name="desiredGoal" maxlength="120" placeholder="例如：作业冲突减少，孩子愿意说出真实困难。">
                    </div>
                </section>

                <section class="rounded-lg border border-slate-200 bg-slate-50 p-4">
                    <h2 class="mb-3 text-sm font-black text-slate-900">已识别方向</h2>
                    <div id="profileSummary" class="grid gap-2 text-sm leading-6 text-slate-600"></div>
                </section>

                <div class="grid gap-3 sm:grid-cols-2">
                    <button type="button" data-action="generate-family-report" class="action-button bg-teal-700 px-4 py-3 text-white shadow-lg shadow-teal-900/10 sm:col-span-2">
                        <i class="fas fa-file-circle-check mr-2"></i>生成专业指导报告
                    </button>
                    <button type="button" data-action="save-family-report" class="action-button border border-slate-300 bg-white px-4 py-3 text-slate-700">
                        <i class="fas fa-floppy-disk mr-2"></i>保存
                    </button>
                    <button type="button" data-action="reset-family-generator" class="action-button border border-slate-300 bg-white px-4 py-3 text-slate-700">
                        <i class="fas fa-rotate-left mr-2"></i>重置
                    </button>
                </div>
            </form>
        </aside>

        <section class="print-column tool-panel min-w-0">
            <div class="flex flex-col gap-4 border-b border-slate-200 p-5 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-xs font-black uppercase tracking-[0.18em] text-slate-500">Professional Guidance Report</p>
                    <h2 class="mt-2 text-xl font-black text-slate-900">家庭教育指导报告</h2>
                </div>
                <div class="report-actions flex flex-wrap gap-2">
                    <button type="button" data-action="copy-family-report" class="action-button border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700">
                        <i class="fas fa-copy mr-2"></i>复制
                    </button>
                    <button type="button" data-action="print-family-report" class="action-button border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700">
                        <i class="fas fa-print mr-2"></i>打印
                    </button>
                </div>
            </div>

            <div id="reportView" class="p-5">
                <div class="empty-state">
                    <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-teal-50 text-2xl text-teal-700">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3 class="text-lg font-black text-slate-900">等待生成家庭成长方案</h3>
                    <p class="mt-2 max-w-md text-sm leading-6">填写左侧信息后，系统会基于 KUA 框架和家庭教育政策原则，生成一份专业型家庭教育指导报告。</p>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="auth.js"></script>
    <script>
        window.HAPPYKUA_AI_ENABLED = false;

        const FAMILY_STORAGE_KEY = "happykua-family-growth-report";

        const ageStageGuides = {
            lowerPrimary: {
                label: "小学低年级（1-3 年级）",
                focus: "习惯建立、规则感、情绪表达与安全依恋",
                insight: [
                    "这个阶段的孩子更依赖可见规则、稳定节奏和即时反馈，抽象说教效果有限。",
                    "学习习惯的核心不是单次作业完成，而是固定流程、低阻力开始和完成后的积极确认。",
                    "孩子出现拖延、顶嘴或哭闹时，常常是在表达能力不足、任务难度过高或情绪调节资源不足。"
                ],
                parentRole: "家长需要做规则示范者和情绪容器，用简短、具体、稳定的方式建立秩序。",
                tone: "少解释大道理，多用可执行的小步骤。"
            },
            upperPrimary: {
                label: "小学高年级（4-6 年级）",
                focus: "自主学习、同伴关系、电子产品边界与挫折耐受",
                insight: [
                    "孩子开始追求自主感和被尊重感，过度控制会让学习问题升级成关系对抗。",
                    "高年级问题常同时包含学业压力、同伴比较、数字娱乐和亲子沟通方式变化。",
                    "规则仍然必要，但需要从单向命令转为共同约定、过程监督和复盘。"
                ],
                parentRole: "家长需要做边界共建者，帮助孩子从被动服从过渡到参与规则、承担结果。",
                tone: "把要求转成约定，把批评转成复盘。"
            },
            juniorHigh: {
                label: "初中 / 青春期",
                focus: "边界感、自我认同、亲子冲突、手机社交与学业压力",
                insight: [
                    "青春期孩子更在意自主、隐私和同伴评价，强压式管控容易触发防御。",
                    "表面的对抗背后，可能有压力、羞耻感、无力感或对尊重的需要。",
                    "家长的首要任务是守住安全底线，同时把沟通从审问转为协商。"
                ],
                parentRole: "家长需要做稳定的支持者和边界维护者，在尊重中保留必要规则。",
                tone: "先连接，再讨论边界；先理解，再谈责任。"
            },
            seniorHigh: {
                label: "高中 / 升学压力期",
                focus: "压力支持、目标感、信任关系和心理稳定",
                insight: [
                    "高中阶段的家庭教育重点从管理行为转向支持压力、保持信任和协助规划。",
                    "频繁比较、追问成绩或否定努力，会降低孩子求助意愿。",
                    "家长应减少临场指挥，增加情绪稳定、资源支持和必要时的专业求助。"
                ],
                parentRole: "家长需要做压力缓冲者和资源协调者，帮助孩子维持可持续的学习状态。",
                tone: "少评价，多支持；少追问，多共情。"
            }
        };

        const familyContextGuides = {
            twoParents: {
                label: "双亲共同养育",
                risk: "若父母分工不清，容易出现一方管教、一方旁观的失衡。",
                coordination: [
                    "父母先在孩子不在场时统一本周只处理一个核心目标。",
                    "明确一位主要执行人和一位支持人，避免同一件事被重复批评。",
                    "每天用 5 分钟同步孩子状态，不在情绪高点临时升级规则。"
                ]
            },
            inconsistentParents: {
                label: "父母教育理念不一致",
                risk: "孩子会在不同规则之间摇摆，问题也容易被转化为夫妻冲突。",
                coordination: [
                    "先暂停互相指责，把分歧写成两个具体选项，再讨论共同底线。",
                    "对孩子只发布一个家庭版本的规则，父母私下再复盘执行效果。",
                    "允许方法不同，但奖惩、电子产品、作息等底线必须一致。"
                ]
            },
            grandparent: {
                label: "隔代养育参与较多",
                risk: "祖辈的照顾优势很重要，但规则不一致会削弱孩子的边界感。",
                coordination: [
                    "感谢祖辈照护价值，再提出 1-2 条最关键的共同规则。",
                    "把规则写成家里所有照护人都能执行的短句，减少临场争辩。",
                    "父母承担教育主责，祖辈承担陪伴支持，分工要被孩子清楚看见。"
                ]
            },
            singleParent: {
                label: "单亲家庭",
                risk: "家长可能同时承担陪伴、规则、经济和情绪压力，容易过度疲惫。",
                coordination: [
                    "优先建立稳定作息和高质量短陪伴，不追求事事完美。",
                    "为孩子保留稳定、可信任的成人支持网络，如亲友、老师或社工资源。",
                    "避免把成人关系压力转移给孩子，也不让孩子承担伴侣式安慰角色。"
                ]
            },
            reconstituted: {
                label: "重组家庭",
                risk: "亲密关系和管教权威需要时间建立，过快要求认同会造成抵触。",
                coordination: [
                    "继父母或新家庭成员先以支持和陪伴建立信任，再逐步参与规则执行。",
                    "亲生父母承担主要管教沟通，避免让孩子把规则理解为新成员控制。",
                    "保留孩子表达复杂感受的空间，不把接纳速度作为评价孩子的标准。"
                ]
            },
            multiChild: {
                label: "多孩家庭",
                risk: "手足冲突常与公平感、关注分配和角色标签有关。",

                            <span class="metric-chip"><i class="fas fa-compass text-amber-700"></i>${escapeHtml(report.profile.primaryConcernLabel)}</span>
                        </div>
                        <h3 class="text-2xl font-black tracking-tight text-slate-950">${escapeHtml(report.title)}</h3>
                        <p class="mt-2 text-sm leading-6 text-slate-600">这是一份基于本地规则生成的专业型家庭教育指导报告。未来接入 AI 后，将沿用同一份家庭画像与报告结构。</p>
                    </div>

                    <section class="report-section">
                        <h3 class="section-title"><i class="fas fa-magnifying-glass-chart"></i>一、问题初步判断</h3>
                        ${renderList(report.summary)}
                    </section>

                    <section class="report-section">
                        <h3 class="section-title"><i class="fas fa-user-clock"></i>二、年龄阶段发展特点</h3>
                        <div class="grid gap-3 text-sm leading-7 text-slate-600">
                            <p><strong class="text-slate-900">阶段重点：</strong>${escapeHtml(report.stageInsight.focus)}</p>
                            <p><strong class="text-slate-900">家长角色：</strong>${escapeHtml(report.stageInsight.parentRole)}</p>
                            ${renderList(report.stageInsight.points)}
                        </div>
                    </section>

                    <section class="report-section">
                        <h3 class="section-title"><i class="fas fa-diagram-project"></i>三、KUA 分析</h3>
                        <div class="kua-grid">
                            <div id="kuaKnowledge" class="kua-box">
                                <h4 class="text-teal-800">知 Knowledge</h4>
                                ${renderList(report.kua.knowledge)}
                            </div>
                            <div id="kuaUnion" class="kua-box">
                                <h4 class="text-blue-800">联 Union</h4>
                                ${renderList(report.kua.union)}
                            </div>
                            <div id="kuaAction" class="kua-box">
                                <h4 class="text-amber-800">行 Action</h4>
                                ${renderList(report.kua.action)}
                            </div>
                        </div>
                    </section>

                    <section id="policyPrinciples" class="report-section">
                        <h3 class="section-title"><i class="fas fa-scale-balanced"></i>四、政策与家庭教育原则</h3>
                        <div class="grid gap-3">
                            ${report.policyPrinciples.map(item => `
                                <div class="principle-row">
                                    <div>
                                        <p class="text-sm font-black text-slate-900">${escapeHtml(item.title)}</p>
                                        <p class="mt-1 text-xs font-bold text-slate-400">${escapeHtml(item.source)}</p>
                                    </div>
                                    <p class="text-sm leading-6 text-slate-600">${escapeHtml(item.guidance)}</p>
                                </div>
                            `).join("")}
                        </div>
                        <div class="mt-4 grid gap-2 text-xs leading-6 text-slate-500 sm:grid-cols-2">
                            <a class="font-bold text-teal-700 underline-offset-4 hover:underline" href="https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_qtxgfl/202110/t20211025_574749.html" target="_blank" rel="noreferrer">家庭教育促进法相关资料</a>
                            <a class="font-bold text-teal-700 underline-offset-4 hover:underline" href="https://www.moe.gov.cn/jyb_xwfb/s5147/202204/t20220413_616321.html" target="_blank" rel="noreferrer">家庭教育指导五年规划相关资料</a>
                        </div>
                    </section>

                    <section class="report-section">
                        <h3 class="section-title"><i class="fas fa-people-arrows"></i>五、家庭协同建议</h3>
                        ${renderList(report.coordination)}
                    </section>

                    <section id="actionPlan" class="report-section">
                        <h3 class="section-title"><i class="fas fa-list-check"></i>六、7 天行动方案</h3>
                        <div class="grid gap-3">
                            ${report.actionPlan.map(item => `
                                <div class="day-card">
                                    <div class="day-index">${escapeHtml(item.day)}<span>${escapeHtml(item.theme)}</span></div>
                                    <div>
                                        <p class="text-sm font-black text-slate-900">行动：${escapeHtml(item.action)}</p>
                                        <p class="mt-2 text-sm leading-6 text-slate-600">观察：${escapeHtml(item.observe)}</p>
                                    </div>
                                </div>
                            `).join("")}
                        </div>
                    </section>

                    <section id="riskReminders" class="report-section">
                        <h3 class="section-title"><i class="fas fa-triangle-exclamation"></i>七、风险提醒与进一步求助</h3>
                        ${renderList(report.riskReminders)}
                    </section>

                    <section class="report-section">
                        <h3 class="section-title"><i class="fas fa-comments"></i>可继续追问的方向</h3>
                        <div class="flex flex-wrap gap-2">
                            ${report.followUpPrompts.map(prompt => `<span class="metric-chip">${escapeHtml(prompt)}</span>`).join("")}
                        </div>
                    </section>
                </article>
            `;
        }

        function renderList(items) {
            return `<ul class="report-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
        }

        function buildFamilyStoragePayload() {
            return {
                profile: collectFamilyProfile(),
                report: latestReport,
                savedAt: new Date().toISOString()
            };
        }

        function syncFamilyModule(payload) {
            const auth = window.HappyKuaAuth;
            if (!auth) return;
            auth.setModuleData("family", {
                profile: payload.profile,
                report: payload.report,
                savedAt: payload.savedAt,
                progress: {
                    completed: Boolean(payload.report),
                    count: payload.report ? 1 : 0,
                    lastActivityAt: payload.savedAt
                }
            });
        }

        function saveFamilyReport() {
            const payload = buildFamilyStoragePayload();
            syncFamilyModule(payload);
            const auth = window.HappyKuaAuth;
            if (!auth || auth.getCurrentUser().isGuest) {
                localStorage.setItem(FAMILY_STORAGE_KEY, JSON.stringify(payload));
            }
            showToast("家庭方案已保存到本地浏览器。");
        }

        async function copyFamilyReport() {
            if (!latestReport) {
                showToast("请先生成报告，再复制。");
                return;
            }
            const text = buildReportText(latestReport);
            try {
                await navigator.clipboard.writeText(text);
                showToast("报告内容已复制。");
            } catch (error) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                textArea.remove();
                showToast("报告内容已复制。");
            }
        }

        function resetFamilyGenerator() {
            const auth = window.HappyKuaAuth;
            if (auth) auth.clearModuleData("family");
            document.getElementById("familyForm").reset();
            latestReport = null;
            if (!auth || auth.getCurrentUser().isGuest) {
                localStorage.removeItem(FAMILY_STORAGE_KEY);
            }
            updateProfileSummary();
            document.getElementById("reportView").innerHTML = `
                <div class="empty-state">
                    <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-teal-50 text-2xl text-teal-700">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <h3 class="text-lg font-black text-slate-900">等待生成家庭成长方案</h3>
                    <p class="mt-2 max-w-md text-sm leading-6">填写左侧信息后，系统会基于 KUA 框架和家庭教育政策原则，生成一份专业型家庭教育指导报告。</p>
                </div>
            `;
            showToast("已重置家庭方案生成器。");
        }

        function buildReportText(report) {
            const lines = [
                report.title,
                `生成时间：${report.generatedAt}`,
                "",
                "一、问题初步判断",
                ...report.summary.map(item => `- ${item}`),
                "",
                "二、年龄阶段发展特点",
                `- 阶段重点：${report.stageInsight.focus}`,
                `- 家长角色：${report.stageInsight.parentRole}`,
                ...report.stageInsight.points.map(item => `- ${item}`),
                "",
                "三、KUA 分析",
                "知 Knowledge",
                ...report.kua.knowledge.map(item => `- ${item}`),
                "联 Union",
                ...report.kua.union.map(item => `- ${item}`),
                "行 Action",
                ...report.kua.action.map(item => `- ${item}`),
                "",
                "四、政策与家庭教育原则",
                ...report.policyPrinciples.map(item => `- ${item.title}：${item.guidance}`),
                "",
                "五、家庭协同建议",
                ...report.coordination.map(item => `- ${item}`),
                "",
                "六、7 天行动方案",
                ...report.actionPlan.map(item => `- ${item.day} ${item.theme}：${item.action}；观察：${item.observe}`),
                "",
                "七、风险提醒与进一步求助",
                ...report.riskReminders.map(item => `- ${item}`)
            ];
            return lines.join("\n");
        }

        function updateProfileSummary() {
            const profile = collectFamilyProfile();
            const summary = document.getElementById("profileSummary");
            summary.innerHTML = `
                <p><strong class="text-slate-900">孩子阶段：</strong>${escapeHtml(profile.ageStageLabel)}</p>
                <p><strong class="text-slate-900">家庭画像：</strong>${escapeHtml(profile.familyContextLabel)}，${escapeHtml(profile.caregiverLabel)}</p>
                <p><strong class="text-slate-900">主要议题：</strong>${escapeHtml(profile.primaryConcernLabel)}</p>
                <p><strong class="text-slate-900">报告倾向：</strong>${escapeHtml(ageStageGuides[profile.ageStage].focus)} · ${escapeHtml(concernGuides[profile.primaryConcern].label)}</p>
            `;
        }

        function restoreSavedReport() {
            const auth = window.HappyKuaAuth;
            const moduleData = auth?.getModuleData("family") || {};
            if (moduleData.profile || moduleData.report) {
                if (moduleData.profile) {
                    for (const [key, value] of Object.entries(moduleData.profile)) {
                        const input = document.getElementById(key);
                        if (input && typeof value === "string") {
                            input.value = value;
                        }
                    }
                }
                updateProfileSummary();
                if (moduleData.report) {
                    renderFamilyReport(moduleData.report);
                }
                return;
            }

            if (auth && !auth.getCurrentUser().isGuest) return;

            const raw = localStorage.getItem(FAMILY_STORAGE_KEY);
            if (!raw) return;
            try {
                const payload = JSON.parse(raw);
                if (payload.profile) {
                    for (const [key, value] of Object.entries(payload.profile)) {
                        const input = document.getElementById(key);
                        if (input && typeof value === "string") {
                            input.value = value;
                        }
                    }
                }
                updateProfileSummary();
                if (payload.report) {
                    renderFamilyReport(payload.report);
                }
                syncFamilyModule(payload);
            } catch (error) {
                localStorage.removeItem(FAMILY_STORAGE_KEY);
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("is-visible");
            window.clearTimeout(toastTimer);
            toastTimer = window.setTimeout(() => {
                toast.classList.remove("is-visible");
            }, 2400);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function handleGenerateReport() {
            const profile = collectFamilyProfile();
            const report = await generateFamilyReport(profile);
            renderFamilyReport(report);
            saveFamilyReport();
            window.HappyKuaAuth?.awardHappinessAction("familyReportGenerated", {
                moduleId: "family"
            });
            showToast("专业指导报告已生成。");
        }

        document.querySelector('[data-action="generate-family-report"]').addEventListener("click", handleGenerateReport);
        document.querySelector('[data-action="save-family-report"]').addEventListener("click", saveFamilyReport);
        document.querySelector('[data-action="reset-family-generator"]').addEventListener("click", resetFamilyGenerator);
        document.querySelector('[data-action="copy-family-report"]').addEventListener("click", copyFamilyReport);
        document.querySelector('[data-action="print-family-report"]').addEventListener("click", () => window.print());
        document.querySelectorAll("#familyForm select, #familyForm textarea, #familyForm input").forEach(input => {
            input.addEventListener("input", updateProfileSummary);
            input.addEventListener("change", updateProfileSummary);
        });
        window.addEventListener("happykua:user-changed", () => window.location.reload());

        updateProfileSummary();
        restoreSavedReport();
    </script>
</body>
</html>
